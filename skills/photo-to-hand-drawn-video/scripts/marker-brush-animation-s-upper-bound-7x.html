        const availableSourceSeconds = DRAWING_END_SECONDS - 2.05;
        const distributableSeconds = Math.max(
          0,
          availableSourceSeconds - activeDrawingStages.length * minimumDrawingStageSeconds,
        );
        const drawingStageWeights = Object.fromEntries(activeDrawingStages.map(drawingStage => [
          drawingStage,
          Math.sqrt(Number(drawingStageCounts[drawingStage]))
            * (DRAWING_STAGE_WEIGHT_FACTORS[drawingStage] || 0.70),
        ]));
        const totalDrawingStageWeight = Object.values(drawingStageWeights)
          .reduce((weightSum, weight) => weightSum + weight, 0);
        let drawingStageStartSeconds = 2.05;
        semanticDrawingStageWindows = {};
        DRAWING_STAGE_ORDER.forEach(drawingStage => {
          if (!activeDrawingStages.includes(drawingStage)) {
            semanticDrawingStageWindows[drawingStage] = {
              startSeconds: drawingStageStartSeconds,
              endSeconds: drawingStageStartSeconds,
            };
            return;
          }
          const proportionalSeconds = totalDrawingStageWeight > 0
            ? distributableSeconds * drawingStageWeights[drawingStage] / totalDrawingStageWeight
            : 0;
          semanticDrawingStageWindows[drawingStage] = {
            startSeconds: drawingStageStartSeconds,
            endSeconds: drawingStageStartSeconds + minimumDrawingStageSeconds + proportionalSeconds,
          };
          drawingStageStartSeconds = semanticDrawingStageWindows[drawingStage].endSeconds;
        });
      } else if (usesAdaptiveTimeline) {
        const phaseWeightFactors = {
          structure_line: 0.72,
          region_fill: 1.10,
          region_glaze: 0.82,
          refine_coat: 0.76,
          hair_detail: 0.82,
          detail_line: 0.86,
          focus_detail: 0.92,
          face_detail: 1.00,
          anime_refine_broad: 0.72,
          anime_refine_medium: 0.78,
          anime_refine_detail: 0.86,
          anime_refine_micro: 0.92,
          anime_refine_ultra: 0.96,
          anime_subject_detail: 0.90,
          anime_identity_detail: 1.08,
          anime_final_ink: 0.78,
          anime_identity_ink: 0.96,
          s_structure_optimization: 0.42,
          s_surface_optimization: 0.38,
          s_subject_optimization: 0.44,
          s_visual_anchor_optimization: 0.50,
          s_identity_optimization: 0.52,
          s_face_core_optimization: 0.58,
          person_clothes_polish: 0.62,
          person_skin_polish: 0.62,
          person_contour_reinforcement: 0.60,
          person_hair_polish: 0.64,
          face_skin_polish: 0.64,
          face_feature_structure: 0.70,
        };
        const phaseCounts = strokePlan.stats.phaseCounts || {};
        const activePhases = Object.keys(PHASE_WINDOWS)
          .filter(phase => Number(phaseCounts[phase] || 0) > 0);
        const minimumPhaseSeconds = 2.4;
        const availableSourceSeconds = DRAWING_END_SECONDS - 2.05;
        const distributableSeconds = Math.max(
          0,
          availableSourceSeconds - activePhases.length * minimumPhaseSeconds,
        );
        const phaseWeights = Object.fromEntries(activePhases.map(phase => [
          phase,
          Math.sqrt(Number(phaseCounts[phase])) * (phaseWeightFactors[phase] || 0.75),
        ]));
        const totalWeight = Object.values(phaseWeights).reduce((sum, weight) => sum + weight, 0);
        let phaseStartSeconds = 2.05;
        Object.keys(PHASE_WINDOWS).forEach(phase => {
          if (!activePhases.includes(phase)) {
            PHASE_WINDOWS[phase].startSeconds = phaseStartSeconds;
            PHASE_WINDOWS[phase].endSeconds = phaseStartSeconds;
            return;
          }
          const proportionalSeconds = totalWeight > 0
            ? distributableSeconds * phaseWeights[phase] / totalWeight
            : 0;
          PHASE_WINDOWS[phase].startSeconds = phaseStartSeconds;
          phaseStartSeconds += minimumPhaseSeconds + proportionalSeconds;
          PHASE_WINDOWS[phase].endSeconds = phaseStartSeconds;
        });
      }

      const painter = await brushlib.create(artCanvas);
      const brushByName = name => brushlib.brushes.find(brush => brush.name === name);

      let scheduledStrokes = [];
      let currentStrokeIndex = 0;
      let animationTimeSeconds = 0;
      let previousFrameTimestamp = null;
      let isPlaying = false;
      let lastTimeSeconds = -1;
      let displayedBrushTip = null;
      let lastBrushIconPlaybackTimeSeconds = -1;

      function clamp(value, minimum = 0, maximum = 1) {
        return Math.min(maximum, Math.max(minimum, value));
      }

      function sourceTimeForPlaybackTime(playbackTimeSeconds) {
        if (playbackTimeSeconds <= DETAIL_PLAYBACK_START_SECONDS) {
          return playbackTimeSeconds * NORMAL_PLAYBACK_RATE;
        }
        if (playbackTimeSeconds <= DETAIL_PLAYBACK_END_SECONDS) {
          return DETAIL_SOURCE_START_SECONDS
            + (playbackTimeSeconds - DETAIL_PLAYBACK_START_SECONDS) * DETAIL_PLAYBACK_RATE;
        }
        if (playbackTimeSeconds <= S_OPTIMIZATION_PLAYBACK_END_SECONDS) {
          return S_OPTIMIZATION_SOURCE_START_SECONDS
            + (playbackTimeSeconds - S_OPTIMIZATION_PLAYBACK_START_SECONDS)
              * S_OPTIMIZATION_PLAYBACK_RATE;
        }
        return Math.min(
          SOURCE_DURATION_SECONDS,
          S_OPTIMIZATION_SOURCE_END_SECONDS
            + (playbackTimeSeconds - S_OPTIMIZATION_PLAYBACK_END_SECONDS) * NORMAL_PLAYBACK_RATE,
        );
      }

      function playbackTimeForSourceTime(sourceTimeSeconds) {
        if (sourceTimeSeconds <= DETAIL_SOURCE_START_SECONDS) {
          return sourceTimeSeconds / NORMAL_PLAYBACK_RATE;
        }
        if (sourceTimeSeconds <= DETAIL_SOURCE_END_SECONDS) {
          return DETAIL_PLAYBACK_START_SECONDS
            + (sourceTimeSeconds - DETAIL_SOURCE_START_SECONDS) / DETAIL_PLAYBACK_RATE;
        }
        if (sourceTimeSeconds <= S_OPTIMIZATION_SOURCE_END_SECONDS) {
          return S_OPTIMIZATION_PLAYBACK_START_SECONDS
            + (sourceTimeSeconds - S_OPTIMIZATION_SOURCE_START_SECONDS)
              / S_OPTIMIZATION_PLAYBACK_RATE;
        }
        return S_OPTIMIZATION_PLAYBACK_END_SECONDS
          + (sourceTimeSeconds - S_OPTIMIZATION_SOURCE_END_SECONDS) / NORMAL_PLAYBACK_RATE;
      }
      function easeOutCubic(value) {
        const inverted = 1 - clamp(value);
        return 1 - inverted * inverted * inverted;
      }
      function smoothstep(value) {
        const clamped = clamp(value);
        return clamped * clamped * (3 - 2 * clamped);
      }
      function resizeVideoFrame() {
        const scale = Math.min(window.innerWidth / STAGE_WIDTH, window.innerHeight / STAGE_HEIGHT);
        videoFrame.style.transform = `scale(${scale})`;
      }

      function hexToRgb(hex) {
        return [1, 3, 5].map(offset => parseInt(hex.slice(offset, offset + 2), 16));
      }

      // --- Preprocess strokes: resolve geometry (px), pressure profile, brush.
      function buildRuntimeStroke(stroke) {
        const points = stroke.points.map(point => ({
          x: point[0] * ARTBOARD_SIZE,
          y: point[1] * ARTBOARD_SIZE,
        }));
        // Very short facial marks need several dabs; with the global 12 px
        // spacing an eyebrow or eyelid could collapse to one tapered endpoint.
        const isMicroDetail = stroke.phase === 'face_detail'
          || stroke.phase === 'anime_refine_micro'
          || stroke.phase === 'anime_refine_ultra'
          || stroke.phase === 'anime_subject_detail'
          || stroke.phase === 'anime_identity_detail'
          || stroke.phase === 'anime_final_ink'
          || stroke.phase === 'anime_identity_ink'
          || stroke.phase === 's_structure_optimization'
          || stroke.phase === 's_surface_optimization'
          || stroke.phase === 's_subject_optimization'
          || stroke.phase === 's_visual_anchor_optimization'
          || stroke.phase === 's_identity_optimization'
          || stroke.phase === 's_face_core_optimization'
          || stroke.phase === 'person_clothes_polish'
          || stroke.phase === 'person_skin_polish'
          || stroke.phase === 'person_contour_reinforcement'
          || stroke.phase === 'person_hair_polish'
          || stroke.phase === 'face_skin_polish'
          || stroke.phase === 'face_feature_structure';
        const maximumSegmentLengthPx = (isMicroDetail ? 1.5 : 12) * INTERNAL_RENDER_SCALE;
        const dense = [points[0]];
        for (let i = 1; i < points.length; i += 1) {
          const previous = dense[dense.length - 1];
          const distance = Math.hypot(points[i].x - previous.x, points[i].y - previous.y);
          const pieces = Math.max(1, Math.ceil(distance / maximumSegmentLengthPx));
          for (let k = 1; k <= pieces; k += 1) {
            dense.push({
              x: previous.x + ((points[i].x - previous.x) * k) / pieces,
              y: previous.y + ((points[i].y - previous.y) * k) / pieces,
            });
          }
        }
        const lengths = [0];
        for (let i = 1; i < dense.length; i += 1) {
          lengths.push(lengths[i - 1] + Math.hypot(dense[i].x - dense[i - 1].x, dense[i].y - dense[i - 1].y));
        }
        const totalLength = Math.max(lengths[lengths.length - 1], 1e-6);

        const [brushName, widthScaleBase, alphaOverride, useMultiply, maxWidthPx] = PHASE_BRUSHES[stroke.phase] || PHASE_BRUSHES.region_fill;
        let resolvedBrush = brushName;
        let widthScale = widthScaleBase;
        let resolvedAlphaOverride = alphaOverride;
        if (BRUSH_DYNAMIC) {
          const random = mulberry32(strokeSeed(stroke));
          const pool = BRUSH_POOLS[resolvedBrush] || [resolvedBrush];
          resolvedBrush = pool[Math.floor(random() * pool.length)];
          widthScale = widthScaleBase * (0.82 + random() * 0.36);
          if (alphaOverride != null) {
            resolvedAlphaOverride = clamp(alphaOverride + (random() - 0.5) * 0.12, 0.30, 1.0);
          }
        }
        const widthPx = Math.min(
          maxWidthPx * INTERNAL_RENDER_SCALE,
          Math.max(1.2 * INTERNAL_RENDER_SCALE, stroke.width * ARTBOARD_SIZE * widthScale),
        );
        if (stroke.phase === 'region_fill' && widthPx >= WIDE_FILL_BRUSH_PX) resolvedBrush = 'dry_marker';
        const alpha = resolvedAlphaOverride == null ? clamp(stroke.alpha, 0.15, 0.97) : resolvedAlphaOverride;
        const colorStops = (stroke.colorStops || [stroke.color]).map(hexToRgb);
        const isFillLike = stroke.phase === 'region_fill'
          || stroke.phase === 'region_glaze'
          || stroke.phase === 'anime_refine_broad'
          || stroke.phase === 'anime_refine_medium';
        return { dense, lengths, totalLength, brushName: resolvedBrush, widthPx, alpha, useMultiply, colorStops, isFillLike };
      }

      function prepareBrush(runtime) {
        const clone = JSON.parse(JSON.stringify(brushByName(runtime.brushName)));
        const settings = clone.settings;
        settings.radius_logarithmic.base_value = Math.log(Math.max(runtime.widthPx, 1.0) / 2);
        if (settings.opaque) settings.opaque.base_value = runtime.alpha;
        if (runtime.isFillLike) {
          // Dense dab train so serpentine fills stay solid through turns.
          if (!settings.dabs_per_actual_radius) settings.dabs_per_actual_radius = { base_value: 0, inputs: {} };
          settings.dabs_per_actual_radius.base_value = Math.max(5, settings.dabs_per_actual_radius.base_value);
          if (!settings.dabs_per_basic_radius) settings.dabs_per_basic_radius = { base_value: 0, inputs: {} };
          settings.dabs_per_basic_radius.base_value = Math.max(5, settings.dabs_per_basic_radius.base_value);
          if (!settings.hardness) settings.hardness = { base_value: 0.5, inputs: {} };
          settings.hardness.base_value = Math.max(0.75, settings.hardness.base_value);
        }
        delete clone.size;
        painter.setBrush(clone);
        painter.setBrushSize(1);
        painter.setColor(...runtime.colorStops[0]);
      }

      function strokeColorAt(runtime, t) {
        const stops = runtime.colorStops;
        if (stops.length === 1) return stops[0];
        const position = clamp(t) * (stops.length - 1);
        const lower = Math.min(Math.floor(position), stops.length - 2);
        const fraction = position - lower;
        return [0, 1, 2].map(channel =>
          Math.round(stops[lower][channel] + (stops[lower + 1][channel] - stops[lower][channel]) * fraction)
        );
      }

      function pressureAt(t, isFillLike) {
        if (isFillLike) {
          const taper = Math.min(1, Math.min(t, 1 - t) / 0.08);
          return 0.62 + 0.24 * easeOutCubic(taper);
        }
        const taper = Math.min(1, Math.min(t, 1 - t) / 0.14);
        return 0.28 + 0.62 * easeOutCubic(taper);
      }

      // Feed a stroke from its fed fraction to targetFraction. Returns tip point.
      function feedStroke(scheduled, targetFraction) {
        const runtime = scheduled.runtime;
        const context = artContext;
        context.save();
        context.globalCompositeOperation = runtime.useMultiply ? 'multiply' : 'source-over';
        if (scheduled.fedIndex < 0) {
          prepareBrush(runtime);
          painter.newStroke(runtime.dense[0].x, runtime.dense[0].y);
          scheduled.fedIndex = 0;
        } else {
          // Brush state belongs to this stroke already (strict sequential feeding).
        }
        const targetLength = runtime.totalLength * clamp(targetFraction);
        let tip = runtime.dense[Math.max(scheduled.fedIndex, 0)];
        let index = scheduled.fedIndex;
        let lastColorKey = -1;
        while (index + 1 < runtime.dense.length && runtime.lengths[index + 1] <= targetLength) {
          index += 1;
          const t = runtime.lengths[index] / runtime.totalLength;
          if (runtime.colorStops.length > 1) {
            const colorKey = Math.floor(t * 24);
            if (colorKey !== lastColorKey) {
              painter.setColor(...strokeColorAt(runtime, t));
              lastColorKey = colorKey;
            }
          }
          painter.stroke(runtime.dense[index].x, runtime.dense[index].y, 0.016, pressureAt(t, runtime.isFillLike), 0, 0);
          tip = runtime.dense[index];
        }
        scheduled.fedIndex = index;
        context.restore();
        return tip;
      }

      function buildStrokeSchedule() {
        const schedule = [];
        const appendStrokesInWindow = (windowStrokes, drawingWindow) => {
          const drawingWindowDuration = drawingWindow.endSeconds - drawingWindow.startSeconds;
          let previousStrokeEndSeconds = -Infinity;
          windowStrokes.forEach((stroke, strokeIndex) => {
            const normalizedIndex = windowStrokes.length <= 1
              ? 0
              : strokeIndex / (windowStrokes.length - 1);
            let pathLength = 0;
            for (let i = 1; i < stroke.points.length; i += 1) {
              pathLength += Math.hypot(
                stroke.points[i][0] - stroke.points[i - 1][0],
                stroke.points[i][1] - stroke.points[i - 1][1],
              );
            }
            const phaseMinimumDurationSeconds = PHASE_WINDOWS[stroke.phase]?.minDurationSeconds
              || 0.012;
            const duration = Math.max(
              phaseMinimumDurationSeconds,
              phaseMinimumDurationSeconds * (0.72 + Math.sqrt(pathLength) * 2.5),
            );
            let startSeconds = drawingWindow.startSeconds
              + normalizedIndex * Math.max(0, drawingWindowDuration - duration);
            let endSeconds = startSeconds + duration;
            if (endSeconds <= previousStrokeEndSeconds) {
              endSeconds = previousStrokeEndSeconds + 0.004;
              startSeconds = Math.max(drawingWindow.startSeconds, endSeconds - duration);
            }
            previousStrokeEndSeconds = endSeconds;
            schedule.push({
              ...stroke,
              startSeconds,
              durationSeconds: endSeconds - startSeconds,
              endSeconds,
              fedIndex: -1,
              runtime: null,
            });
          });
        };

        if (usesSemanticDrawingStages) {
          const strokesByDrawingStage = Object.fromEntries(
            DRAWING_STAGE_ORDER.map(drawingStage => [drawingStage, []]),
          );
          strokePlan.strokes.forEach(stroke => {
            if (stroke.mode) return;
            if (strokesByDrawingStage[stroke.drawingStage]) {
              strokesByDrawingStage[stroke.drawingStage].push(stroke);
            }
          });
          DRAWING_STAGE_ORDER.forEach(drawingStage => {
            appendStrokesInWindow(
              strokesByDrawingStage[drawingStage],
              semanticDrawingStageWindows[drawingStage],
            );
          });
        } else {
          const strokesByPhase = Object.fromEntries(
            Object.keys(PHASE_WINDOWS).map(phase => [phase, []]),
          );
          strokePlan.strokes.forEach(stroke => {
            if (stroke.mode) return;
            if (strokesByPhase[stroke.phase]) strokesByPhase[stroke.phase].push(stroke);
          });
          Object.entries(strokesByPhase).forEach(([phase, phaseStrokes]) => {
            appendStrokesInWindow(phaseStrokes, PHASE_WINDOWS[phase]);
          });
        }
        schedule.sort((a, b) => a.endSeconds - b.endSeconds);
        schedule.forEach(scheduled => { scheduled.runtime = buildRuntimeStroke(scheduled); });
        return schedule;
      }

      function resetPainting() {
        artContext.clearRect(0, 0, ARTBOARD_SIZE, ARTBOARD_SIZE);
        refineContext.clearRect(0, 0, ARTBOARD_SIZE, ARTBOARD_SIZE);
        scheduledStrokes.forEach(scheduled => { scheduled.fedIndex = -1; });
        currentStrokeIndex = 0;
        displayedBrushTip = null;
        lastBrushIconPlaybackTimeSeconds = -1;
      }

      // Strict sequential feeding: one live stroke at a time, like a real hand.
      function advancePainting(currentTimeSeconds) {
        let tipState = null;
        while (currentStrokeIndex < scheduledStrokes.length) {
          const scheduled = scheduledStrokes[currentStrokeIndex];
          if (scheduled.startSeconds >= currentTimeSeconds) break;
          const progress = scheduled.endSeconds <= currentTimeSeconds
            ? 1
            : easeOutCubic((currentTimeSeconds - scheduled.startSeconds) / scheduled.durationSeconds);
          const tip = feedStroke(scheduled, progress);
          if (progress >= 1) {
            currentStrokeIndex += 1;
            continue;
          }
          tipState = { tip, scheduled };
          break;
        }
        return tipState;
      }

      function recentCompletedStrokeTipState() {
        if (currentStrokeIndex <= 0) return null;
        const scheduled = scheduledStrokes[currentStrokeIndex - 1];
        const densePoints = scheduled.runtime?.dense;
        if (!densePoints?.length) return null;
        return {
          tip: densePoints[densePoints.length - 1],
          scheduled,
        };
      }

      function smoothBrushIconTip(tipState, playbackTimeSeconds) {
        const targetTip = tipState.tip;
        const didSeekBackward = playbackTimeSeconds < lastBrushIconPlaybackTimeSeconds;
        if (!displayedBrushTip || didSeekBackward) {
          displayedBrushTip = { x: targetTip.x, y: targetTip.y };
        } else {
          const elapsedSeconds = playbackTimeSeconds - lastBrushIconPlaybackTimeSeconds;
          const blend = 1 - Math.exp(-Math.max(0, elapsedSeconds) * 13);
          displayedBrushTip.x += (targetTip.x - displayedBrushTip.x) * blend;
          displayedBrushTip.y += (targetTip.y - displayedBrushTip.y) * blend;
        }
        lastBrushIconPlaybackTimeSeconds = playbackTimeSeconds;
        return { tip: displayedBrushTip, scheduled: tipState.scheduled };
      }

      function drawBrushIcon(tipState) {
        const { tip, scheduled } = tipState;
        const iconScale = scheduled.phase === 'anime_refine_ultra'
          || scheduled.phase === 'anime_refine_micro'
          || scheduled.phase === 'anime_subject_detail'
          || scheduled.phase === 'anime_identity_detail'
          || scheduled.phase === 'anime_final_ink'
          || scheduled.phase === 'anime_identity_ink'
          || scheduled.phase === 's_structure_optimization'
          || scheduled.phase === 's_surface_optimization'
          || scheduled.phase === 's_subject_optimization'
          || scheduled.phase === 's_identity_optimization'
          || scheduled.phase === 's_visual_anchor_optimization'
          || scheduled.phase === 's_face_core_optimization'
          || scheduled.phase === 'person_clothes_polish'
          || scheduled.phase === 'person_skin_polish'
          || scheduled.phase === 'person_contour_reinforcement'
          || scheduled.phase === 'person_hair_polish'
          || scheduled.phase === 'face_skin_polish'
          || scheduled.phase === 'face_feature_structure'
          ? 0.62
          : 0.88;
        const paintColor = scheduled.color || '#4a4a4a';
        activeContext.save();
        activeContext.translate(tip.x, tip.y);
        activeContext.rotate(Math.PI * 0.72);
        activeContext.scale(iconScale * INTERNAL_RENDER_SCALE, iconScale * INTERNAL_RENDER_SCALE);
        activeContext.shadowColor = 'rgba(20,16,12,0.30)';
        activeContext.shadowBlur = 10;
        activeContext.shadowOffsetY = 3;
        activeContext.fillStyle = paintColor;
        activeContext.beginPath();
        activeContext.moveTo(0, 1);
        activeContext.lineTo(-8, -17);
        activeContext.quadraticCurveTo(0, -23, 8, -17);
        activeContext.closePath();
        activeContext.fill();
        activeContext.shadowColor = 'transparent';
        activeContext.fillStyle = '#c7ccd0';
        activeContext.strokeStyle = '#565a5c';
        activeContext.lineWidth = 1.5;
        activeContext.beginPath();
        activeContext.roundRect(-9, -34, 18, 19, 3);
        activeContext.fill();
        activeContext.stroke();
        const handleGradient = activeContext.createLinearGradient(-7, -84, 7, -34);
        handleGradient.addColorStop(0, '#e5b66e');
        handleGradient.addColorStop(0.55, '#b97935');
        handleGradient.addColorStop(1, '#8e5526');
        activeContext.fillStyle = handleGradient;
        activeContext.strokeStyle = '#68401f';
        activeContext.beginPath();
        activeContext.roundRect(-7, -86, 14, 54, 7);
        activeContext.fill();
        activeContext.stroke();
        activeContext.fillStyle = 'rgba(255,255,255,0.38)';
        activeContext.beginPath();
        activeContext.roundRect(-3.5, -80, 3, 38, 2);
        activeContext.fill();
        activeContext.restore();
      }

      // Optional custom background image: loads async, then redraws the whole
      // stage so the image stays underneath the board grid and paper sheet.
      const backgroundImagePath = pageParameters.get('bgImage');
      const backgroundImageElement = backgroundImagePath ? new Image() : null;
      if (backgroundImageElement) {
        backgroundImageElement.onload = () => drawStageBackground();
        backgroundImageElement.src = backgroundImagePath;
      }

      function drawStageBackground() {
        stageContext.fillStyle = '#14231f';
        stageContext.fillRect(0, 0, STAGE_WIDTH, STAGE_HEIGHT);
        if (backgroundImageElement && backgroundImageElement.complete
          && backgroundImageElement.naturalWidth > 0) {
          const bgOpacity = parseFloat(pageParameters.get('bgOpacity') || '0.85');
          stageContext.save();
          stageContext.globalAlpha = bgOpacity;
          const imageScale = Math.max(
            STAGE_WIDTH / backgroundImageElement.naturalWidth,
            STAGE_HEIGHT / backgroundImageElement.naturalHeight,
          );
          const drawWidth = backgroundImageElement.naturalWidth * imageScale;
          const drawHeight = backgroundImageElement.naturalHeight * imageScale;
          stageContext.drawImage(
            backgroundImageElement,
            (STAGE_WIDTH - drawWidth) / 2,
            (STAGE_HEIGHT - drawHeight) / 2,
            drawWidth,
            drawHeight,
          );
          stageContext.restore();
        }
        const boardGradient = stageContext.createLinearGradient(0, 0, STAGE_WIDTH, STAGE_HEIGHT);
        boardGradient.addColorStop(0, '#36584f');
        boardGradient.addColorStop(0.48, '#2d4b44');
        boardGradient.addColorStop(1, '#213b35');
        stageContext.fillStyle = boardGradient;
        stageContext.fillRect(20, 18, STAGE_WIDTH - 40, STAGE_HEIGHT - 36);
        stageContext.save();
        stageContext.globalAlpha = 0.22;
        stageContext.strokeStyle = '#8bb0a4';
        stageContext.lineWidth = 1;
        for (let gridX = 32; gridX < STAGE_WIDTH; gridX += 40) {
          stageContext.beginPath();
          stageContext.moveTo(gridX, 20);
          stageContext.lineTo(gridX, STAGE_HEIGHT - 20);
          stageContext.stroke();
        }
        for (let gridY = 30; gridY < STAGE_HEIGHT; gridY += 40) {
          stageContext.beginPath();
          stageContext.moveTo(20, gridY);
          stageContext.lineTo(STAGE_WIDTH - 20, gridY);
          stageContext.stroke();
        }
        stageContext.restore();
        // Paper sheet: slightly larger than the art viewport so the sheet
        // edge stays visible; position must track the viewport exactly.
        const paperLeft = VIEW_LEFT - 10;
        const paperTop = VIEW_TOP - 14;
        const paperSize = VIEW_SIZE + 20;
        stageContext.save();
        stageContext.shadowColor = 'rgba(4,16,13,0.48)';
        stageContext.shadowBlur = 26;
        stageContext.shadowOffsetY = 13;
        stageContext.fillStyle = strokePlan.paperColor;
        stageContext.fillRect(paperLeft, paperTop, paperSize, paperSize);
        stageContext.restore();
        stageContext.save();
        stageContext.fillStyle = 'rgba(225, 205, 157, 0.84)';
        [
          [paperLeft + 18, paperTop - 11, -0.06],
          [paperLeft + paperSize - 112, paperTop - 11, 0.05],
          [paperLeft + 18, paperTop + paperSize - 14, 0.05],
          [paperLeft + paperSize - 112, paperTop + paperSize - 14, -0.06],
        ].forEach(([x, y, angle]) => {
          stageContext.translate(x, y);
          stageContext.rotate(angle);
          stageContext.fillRect(0, 0, 96, 25);
          stageContext.rotate(-angle);
          stageContext.translate(-x, -y);
        });
        stageContext.restore();
        strokePlan.palette.slice(0, 5).forEach((color, colorIndex) => {
          const markerX = 62 + colorIndex * 112;
          const markerY = 224 + Math.sin(colorIndex * 1.4) * 10;
          stageContext.save();
          stageContext.translate(markerX, markerY);
          stageContext.rotate(-0.12 + colorIndex * 0.045);
          stageContext.fillStyle = '#ece7da';
          stageContext.beginPath();
          stageContext.roundRect(0, 0, 94, 24, 8);
          stageContext.fill();
          stageContext.fillStyle = color;
          stageContext.beginPath();
          stageContext.roundRect(72, 0, 29, 24, 8);
          stageContext.fill();
          stageContext.restore();
        });
      }

      function regionCenter(region, fallbackX, fallbackY) {
        if (!region) return { x: fallbackX, y: fallbackY };
        return { x: region.left + region.width * 0.5, y: region.top + region.height * 0.5 };
      }

      function interpolateCameraState(fromState, toState, progress) {
        const easedProgress = smoothstep(progress);
        return {
          scale: fromState.scale + (toState.scale - fromState.scale) * easedProgress,
          focusX: fromState.focusX + (toState.focusX - fromState.focusX) * easedProgress,
          focusY: fromState.focusY + (toState.focusY - fromState.focusY) * easedProgress,
        };
      }

      function updateCamera(playbackTimeSeconds) {
        const faceCenter = regionCenter(strokePlan.focusRegions?.face, 0.555, 0.28);
        const upperBodyCenter = regionCenter(strokePlan.focusRegions?.upperBody, 0.5, 0.46);
        const safeFaceFocusY = Math.max(0.35, faceCenter.y);
        const safeUpperBodyFocusY = clamp(upperBodyCenter.y, 0.40, 0.60);
        const fullCanvasState = { scale: 1, focusX: 0.5, focusY: 0.5 };
        const fullSubjectState = {
          scale: 1.08,
          focusX: upperBodyCenter.x,
          focusY: Math.max(0.50, safeUpperBodyFocusY),
        };
        const upperBodyState = {
          scale: 1.22,
          focusX: upperBodyCenter.x,
          focusY: safeUpperBodyFocusY,
        };
        const faceState = { scale: 1.45, focusX: faceCenter.x, focusY: safeFaceFocusY };
        const finalFaceState = { scale: 1.50, focusX: faceCenter.x, focusY: safeFaceFocusY };
        const transitionPlaybackSeconds = 1.25;
        const earlySubjectStartSeconds = playbackTimeForSourceTime(
          Math.max(
            230,
            usesSemanticDrawingStages
              ? semanticDrawingStageWindows.subject_refinement.startSeconds
              : PHASE_WINDOWS.anime_refine_detail.startSeconds,
          ),
        );
        const earlyIdentityStartSeconds = playbackTimeForSourceTime(
          usesSemanticDrawingStages
            ? semanticDrawingStageWindows.subject_identity.startSeconds
            : PHASE_WINDOWS.anime_identity_detail.startSeconds,
        );
        const earlyIdentityEndSeconds = playbackTimeForSourceTime(
          usesSemanticDrawingStages
            ? semanticDrawingStageWindows.background_structure.startSeconds
            : PHASE_WINDOWS.anime_identity_ink.endSeconds,
        );
        const finalSubjectStartSeconds = playbackTimeForSourceTime(
          usesSemanticDrawingStages
            ? semanticDrawingStageWindows.final_subject_correction.startSeconds
            : PHASE_WINDOWS.s_subject_optimization.startSeconds,
        );
        const personHairPolishStartSeconds = playbackTimeForSourceTime(
          usesSemanticDrawingStages
            ? semanticDrawingStageWindows.person_hair_polish.startSeconds
            : PHASE_WINDOWS.person_hair_polish.startSeconds,
        );
        const finalIdentityStartSeconds = playbackTimeForSourceTime(
          usesSemanticDrawingStages
            ? semanticDrawingStageWindows.face_skin_polish.startSeconds
            : PHASE_WINDOWS.s_identity_optimization.startSeconds,
        );
        const drawingEndSeconds = playbackTimeForSourceTime(DRAWING_END_SECONDS);
        const appreciationFaceStartSeconds = playbackTimeForSourceTime(339);
        const appreciationPanStartSeconds = playbackTimeForSourceTime(344);
        const appreciationReturnStartSeconds = playbackTimeForSourceTime(349);
        let cameraState = fullCanvasState;

        // Stable camera: the whole composition is visible while architecture
        // and region fills happen (viewer sees the entire picture being
        // drawn), then it slowly pushes into the subject for refinement.
        if (playbackTimeSeconds < earlySubjectStartSeconds) {
          cameraState = fullCanvasState;
        } else if (playbackTimeSeconds < earlySubjectStartSeconds + transitionPlaybackSeconds) {
          cameraState = interpolateCameraState(
            fullCanvasState,
            upperBodyState,
            (playbackTimeSeconds - earlySubjectStartSeconds) / transitionPlaybackSeconds,
          );
        } else if (playbackTimeSeconds < earlyIdentityStartSeconds - transitionPlaybackSeconds) {
          cameraState = upperBodyState;
        } else if (playbackTimeSeconds < earlyIdentityStartSeconds + transitionPlaybackSeconds) {
          cameraState = interpolateCameraState(
            upperBodyState,
            faceState,
            (playbackTimeSeconds - earlyIdentityStartSeconds + transitionPlaybackSeconds)
              / (transitionPlaybackSeconds * 2),
          );
        } else if (playbackTimeSeconds < earlyIdentityEndSeconds - transitionPlaybackSeconds) {
          cameraState = faceState;
        } else if (playbackTimeSeconds < earlyIdentityEndSeconds + transitionPlaybackSeconds) {
          cameraState = interpolateCameraState(
            faceState,
            fullCanvasState,
            (playbackTimeSeconds - earlyIdentityEndSeconds + transitionPlaybackSeconds)
              / (transitionPlaybackSeconds * 2),
          );
        } else if (playbackTimeSeconds < finalSubjectStartSeconds - transitionPlaybackSeconds) {
          cameraState = fullCanvasState;
        } else if (playbackTimeSeconds < finalSubjectStartSeconds + transitionPlaybackSeconds) {
          cameraState = interpolateCameraState(
            fullCanvasState,
            fullSubjectState,
            (playbackTimeSeconds - finalSubjectStartSeconds + transitionPlaybackSeconds)
              / (transitionPlaybackSeconds * 2),
          );
        } else if (playbackTimeSeconds < personHairPolishStartSeconds - transitionPlaybackSeconds) {
          cameraState = fullSubjectState;
        } else if (playbackTimeSeconds < personHairPolishStartSeconds + transitionPlaybackSeconds) {
          cameraState = interpolateCameraState(
            fullSubjectState,
            upperBodyState,
            (playbackTimeSeconds - personHairPolishStartSeconds + transitionPlaybackSeconds)
              / (transitionPlaybackSeconds * 2),
          );
        } else if (playbackTimeSeconds < finalIdentityStartSeconds - transitionPlaybackSeconds) {
          cameraState = upperBodyState;
        } else if (playbackTimeSeconds < finalIdentityStartSeconds + transitionPlaybackSeconds) {
          cameraState = interpolateCameraState(
            upperBodyState,
            finalFaceState,
            (playbackTimeSeconds - finalIdentityStartSeconds + transitionPlaybackSeconds)
              / (transitionPlaybackSeconds * 2),
          );
        } else if (playbackTimeSeconds < drawingEndSeconds) {
          cameraState = finalFaceState;
        } else if (playbackTimeSeconds < appreciationFaceStartSeconds) {
          cameraState = interpolateCameraState(
            finalFaceState,
            fullCanvasState,
            (playbackTimeSeconds - drawingEndSeconds)
              / (appreciationFaceStartSeconds - drawingEndSeconds),
          );
        } else if (playbackTimeSeconds < appreciationPanStartSeconds) {
          cameraState = interpolateCameraState(
            fullCanvasState,
            { scale: 1.28, focusX: faceCenter.x, focusY: safeFaceFocusY },
            (playbackTimeSeconds - appreciationFaceStartSeconds)
              / (appreciationPanStartSeconds - appreciationFaceStartSeconds),
          );
        } else if (playbackTimeSeconds < appreciationReturnStartSeconds) {
          cameraState = interpolateCameraState(
            { scale: 1.28, focusX: faceCenter.x, focusY: safeFaceFocusY },
            { scale: 1.28, focusX: 0.5, focusY: 0.60 },
            (playbackTimeSeconds - appreciationPanStartSeconds)
              / (appreciationReturnStartSeconds - appreciationPanStartSeconds),
          );
        } else {
          cameraState = interpolateCameraState(
            { scale: 1.28, focusX: 0.5, focusY: 0.60 },
            fullCanvasState,
            (playbackTimeSeconds - appreciationReturnStartSeconds)
              / (VIDEO_DURATION_SECONDS - appreciationReturnStartSeconds),
          );
        }
        const translateX = ARTBOARD_VIEW_SIZE * 0.5
          - cameraState.scale * cameraState.focusX * ARTBOARD_VIEW_SIZE;
        const translateY = ARTBOARD_VIEW_SIZE * 0.5
          - cameraState.scale * cameraState.focusY * ARTBOARD_VIEW_SIZE;
        const cameraTransform = `matrix(${cameraState.scale},0,0,${cameraState.scale},${translateX},${translateY})`;
        artCanvas.style.transform = cameraTransform;
        refineCanvas.style.transform = cameraTransform;
        activeCanvas.style.transform = cameraTransform;
      }

      function animateIntroCard(currentTimeSeconds) {
        const progress = smoothstep(clamp(currentTimeSeconds / INTRO_SECONDS));
        const startWidth = 640;
        const startHeight = 853;
        const endWidth = 224;
        const endHeight = 298;
        const startLeft = (STAGE_WIDTH - startWidth) / 2;
        const startTop = (STAGE_HEIGHT - startHeight) / 2 - 120;
        const endLeft = STAGE_WIDTH - 66 - endWidth;
        const endTop = 48;
        referenceCard.style.right = 'auto';
        referenceCard.style.left = `${startLeft + (endLeft - startLeft) * progress}px`;
        referenceCard.style.top = `${startTop + (endTop - startTop) * progress}px`;
        referenceCard.style.width = `${startWidth + (endWidth - startWidth) * progress}px`;
        referenceCard.style.height = `${startHeight + (endHeight - startHeight) * progress}px`;
        referenceCard.style.transform = `rotate(${-2 * progress}deg)`;
        const tape = document.getElementById('reference-tape');
        if (tape) tape.style.opacity = String(progress);
      }

      function render(playbackTimeSeconds) {
        const currentTimeSeconds = sourceTimeForPlaybackTime(playbackTimeSeconds);
        animateIntroCard(currentTimeSeconds);
        if (currentTimeSeconds < lastTimeSeconds) {
          resetPainting();
          advancePainting(currentTimeSeconds);
        }
        const tipState = advancePainting(currentTimeSeconds);
        activeContext.clearRect(0, 0, ARTBOARD_SIZE, ARTBOARD_SIZE);
        window.__cursorDebug = null;
        const rawBrushTipState = tipState || recentCompletedStrokeTipState();
        // The brush icon blinks: it appears for a short window, then hides
        // for a longer rest (like a hand lifting between strokes). User:
        // "画笔每多少帧出现一次，其他时候不出现" — a continuously moving
        // cursor reads as "too fast" even when the painting is slow.
        const brushBlinkOnSeconds = parseFloat(pageParameters.get('blinkOn') || '0.12');
        const brushBlinkOffSeconds = parseFloat(pageParameters.get('blinkOff') || '0.50');
        const brushCycleSeconds = brushBlinkOnSeconds + brushBlinkOffSeconds;
        const brushCyclePhase = ((currentTimeSeconds - 2) % brushCycleSeconds + brushCycleSeconds) % brushCycleSeconds;
        const shouldShowBrushIcon = currentTimeSeconds >= 2
          && currentTimeSeconds < DRAWING_END_SECONDS
          && brushCyclePhase < brushBlinkOnSeconds;
        if (shouldShowBrushIcon && rawBrushTipState) {
          const displayedBrushTipState = smoothBrushIconTip(rawBrushTipState, playbackTimeSeconds);
          window.__cursorDebug = {
            rawX: rawBrushTipState.tip.x,
            rawY: rawBrushTipState.tip.y,
            displayedX: displayedBrushTipState.tip.x,
            displayedY: displayedBrushTipState.tip.y,
            phase: displayedBrushTipState.scheduled.phase,
          };
          drawBrushIcon(displayedBrushTipState);
        } else {
          displayedBrushTip = null;
          lastBrushIconPlaybackTimeSeconds = -1;
        }
        updateCamera(playbackTimeSeconds);
        lastTimeSeconds = currentTimeSeconds;
      }

      function tick(frameTimestamp) {
        if (previousFrameTimestamp === null) previousFrameTimestamp = frameTimestamp;
        const elapsedSeconds = Math.min(0.05, (frameTimestamp - previousFrameTimestamp) / 1000);
        previousFrameTimestamp = frameTimestamp;
        if (isPlaying) {
          animationTimeSeconds += elapsedSeconds;
          if (animationTimeSeconds >= VIDEO_DURATION_SECONDS) {
            animationTimeSeconds = window.__recording === true ? VIDEO_DURATION_SECONDS : 0;
            isPlaying = window.__recording !== true;
          }
          render(animationTimeSeconds);
        }
        window.__ready = true;
        requestAnimationFrame(tick);
      }

      function initialize() {
        resizeVideoFrame();
        drawStageBackground();
        scheduledStrokes = buildStrokeSchedule();
        resetPainting();
        render(0);
        window.__duration = VIDEO_DURATION_SECONDS;
        window.__strokeStats = strokePlan.stats;
        window.__adaptiveTimeline = usesAdaptiveTimeline;
        window.__seek = requestedTimeSeconds => {
          animationTimeSeconds = clamp(requestedTimeSeconds, 0, VIDEO_DURATION_SECONDS);
          previousFrameTimestamp = performance.now();
          render(animationTimeSeconds);
        };
        window.__play = () => { isPlaying = true; previousFrameTimestamp = performance.now(); };
        window.__pause = () => { isPlaying = false; };
        isPlaying = true;
        previousFrameTimestamp = performance.now();
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', resizeVideoFrame);
      await referenceCard.decode();
      initialize();
    })().catch(error => {
      console.error(error);
      document.title = 'ERROR: ' + error.message;
    });
  </script>
</body>
</html>
